services:
  php-web:
    build: .
    #image: php:8.2-apache
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/html

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: curso_php
    ports:
      - '3306:3306'
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql # Chama o Schema para validar se a tabela já foi criada e popula com alguns dados de amostragem.
